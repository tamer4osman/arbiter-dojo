name: Fallow analysis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write
  pull-requests: write
  checks: write
  security-events: write

jobs:
  fallow:
    name: Codebase analysis
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.4"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Fallow audit (changed-code gate)
        uses: fallow-rs/fallow@v3
        with:
          command: audit
          format: sarif
          comment: true
          review-comments: true
          review-guidance: true
          gate: new-only
          diff-filter: added
          max-comments: 50
          annotations: true
          max-annotations: 50
          sarif: true
          github-token: ${{ github.token }}
          fail-on-issues: true
          type-aware: auto
          type-aware-require: best-effort

      - name: Fallow health (whole-project score)
        if: always()
        uses: fallow-rs/fallow@v3
        with:
          command: health
          format: pr-comment-github
          comment: true
          comment-layout: compact
          score: true
          complexity: true
          file-scores: false
          hotspots: false
          fail-on-issues: false
          type-aware: auto
          type-aware-require: best-effort